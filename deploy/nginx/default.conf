upstream photoengine_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 250m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Enable this only when USE_S3_MEDIA=false in production and you explicitly
    # want nginx to serve local media from the VPS. Keep it disabled when media
    # lives in S3-compatible object storage.
    # location /media/ {
    #     alias /var/www/media/;
    #     expires 1h;
    #     add_header Cache-Control "public, max-age=3600";
    # }

    location / {
        proxy_pass http://photoengine_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

# For SSL, replace the server block above or add a second block that listens on
# 443 and references your Let's Encrypt certificate files from /etc/letsencrypt.
