services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-photoengine}
      POSTGRES_USER: ${POSTGRES_USER:-photoengine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-photoengine}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  web:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-PhotoEngine.settings.production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://photoengine:photoengine@db:5432/photoengine}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      USE_S3_MEDIA: ${USE_S3_MEDIA:-true}
      MEDIA_ROOT: ${MEDIA_ROOT:-/app/media}
      STATIC_ROOT: ${STATIC_ROOT:-/app/staticfiles}
      RUN_MIGRATIONS: "1"
      RUN_COLLECTSTATIC: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["gunicorn", "PhotoEngine.wsgi:application", "--config", "deploy/gunicorn.conf.py"]
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles

  celery:
    build: .
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-PhotoEngine.settings.production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DATABASE_URL: ${DATABASE_URL:-postgresql://photoengine:photoengine@db:5432/photoengine}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      USE_S3_MEDIA: ${USE_S3_MEDIA:-true}
      MEDIA_ROOT: ${MEDIA_ROOT:-/app/media}
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "PhotoEngine", "worker", "-l", "info"]
    volumes:
      - media_data:/app/media

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/letsencrypt:ro
      - ./deploy/nginx/www:/var/www/certbot:ro

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
