{% load wagtailcore_tags %}
<section class="sv-block-essay sv-block-essay--{{ value.align }}">
    <div class="sv-block-essay__inner">
        {% if value.heading %}
        <h2 class="sv-block-essay__heading">{{ value.heading }}</h2>
        {% endif %}
        <div class="sv-block-essay__body">
            {{ value.body|richtext }}
        </div>
    </div>
</section>
