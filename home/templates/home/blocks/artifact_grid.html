{% load wagtailimages_tags %}
<section class="sv-block-gallery">
    {% if value.heading %}
    <div class="sv-container" style="margin-bottom:var(--sv-sp-md);">
        <h3 style="font-size:var(--sv-md); color:var(--sv-warm-white); font-weight:600; letter-spacing:-0.01em;">{{ value.heading }}</h3>
    </div>
    {% endif %}
    <div class="sv-artifact-grid" style="margin:0 var(--sv-sp-md);">
        {% for artifact in value.artifacts %}
        <div class="sv-artifact-card">
            {% image artifact.image fill-600x600 as art_img %}
            <img class="sv-artifact-card__img"
                 src="{{ art_img.url }}"
                 alt="{{ artifact.label }}"
                 loading="lazy"
                 decoding="async">
            <div class="sv-artifact-card__overlay">
                <span class="sv-artifact-card__label">{{ artifact.label }}</span>
            </div>
        </div>
        {% endfor %}
    </div>
</section>
