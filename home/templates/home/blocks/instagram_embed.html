            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor"/>
        </svg>
        {% if value.caption %}{{ value.caption }}{% else %}View on Instagram{% endif %}
    </a>
</section>
