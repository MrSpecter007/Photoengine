<section class="sv-block-cta sv-block-cta--{{ value.style }}">
    <div class="sv-container sv-container--narrow">
        <h2 class="sv-block-cta__heading">{{ value.heading }}</h2>
        {% if value.subtext %}
        <p class="sv-block-cta__subtext">{{ value.subtext }}</p>
        {% endif %}
        {% if value.cta_url %}
        <a href="{{ value.cta_url }}"
           class="sv-btn {% if value.style == 'cream' %}sv-btn--dark{% else %}sv-btn--light{% endif %}">
            {{ value.cta_label|default:"Explore" }}
        </a>
        {% endif %}
    </div>
</section>
