{% load wagtailimages_tags %}
<section class="sv-block-gallery">
    {% if value.heading %}
    <div class="sv-container" style="margin-bottom:var(--sv-sp-md);">
        <h3 style="font-size:var(--sv-md); color:var(--sv-warm-white); font-weight:600;">{{ value.heading }}</h3>
    </div>
    {% endif %}
    <div class="sv-block-gallery__grid sv-block-gallery__grid--{{ value.columns }}">
        {% for image in value.images %}
        {% image image fill-800x600 as gal_img %}
        <div class="sv-block-gallery__item">
            <img src="{{ gal_img.url }}"
                 alt="{{ image.title }}"
                 loading="lazy"
                 decoding="async">
        </div>
        {% endfor %}
    </div>
</section>
