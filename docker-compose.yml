services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=wagtail
      - POSTGRES_USER=wagtail
      - POSTGRES_PASSWORD=wagtail_secret_pass

  web:
    build: .
    user: "0:0"
    command: >
      sh -c "mkdir -p /app/media/original_images /app/staticfiles &&
      chown -R wagtail:wagtail /app/media /app/staticfiles &&
      su wagtail -s /bin/sh -c 'python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000'"
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://wagtail:wagtail_secret_pass@db:5432/wagtail
      - DEBUG=1
      - SECRET_KEY=django-insecure-dev-key
    depends_on:
      - db

volumes:
  postgres_data:
  media_data:
